<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Amanets — Coming Soon</title>
<meta name="description" content="Amanets is almost here. Something new is rising. Join the list and be first through the door." />
<meta name="theme-color" content="#141118" />

<meta property="og:type" content="website" />
<meta property="og:title" content="Amanets — Coming Soon" />
<meta property="og:description" content="Something new is rising. Join the list and be first through the door." />
<meta property="og:image" content="assets/og.svg" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Amanets — Coming Soon" />
<meta name="twitter:description" content="Something new is rising. Join the list and be first through the door." />
<meta name="twitter:image" content="assets/og.svg" />

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/favicon.svg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<canvas id="starfield" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<div class="page" id="page">

  <!-- ── Header ─────────────────────────────────────── -->
  <header class="topbar reveal" style="--d:.1s">
    <a class="logo" href="/" aria-label="Amanets home">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="lg" x1="6" y1="4" x2="34" y2="36" gradientUnits="userSpaceOnUse">
              <stop stop-color="#ffd2a8"/><stop offset=".5" stop-color="#f2879a"/><stop offset="1" stop-color="#b2506f"/>
            </linearGradient>
          </defs>
          <circle cx="20" cy="20" r="15.5" stroke="url(#lg)" stroke-width="2.4"/>
          <circle cx="24.5" cy="17" r="13" fill="#141118"/>
          <circle cx="28.8" cy="11.6" r="2.6" fill="#ffd2a8"/>
        </svg>
      </span>
      <span class="logo-type">Amanets<i>.</i></span>
    </a>

    <span class="badge" aria-label="Status: in development">
      <i class="dot" aria-hidden="true"></i> In development
    </span>
  </header>

  <!-- ── Stage ──────────────────────────────────────── -->
  <main class="stage" id="stage">
    <div class="eclipse" id="eclipse" aria-hidden="true">
      <div class="corona"></div>
      <div class="corona corona--2"></div>
      <div class="ring"></div>
      <div class="orbit"><span class="flare"></span></div>
      <div class="orbit orbit--slow"><span class="flare flare--sm"></span></div>
      <div class="disc"></div>
    </div>

    <div class="content">
      <h1 class="title" id="title" aria-label="Coming Soon">
        <span class="word">
          <span>C</span><span>O</span><span>M</span><span>I</span><span>N</span><span>G</span>
        </span>
        <span class="word">
          <span>S</span><span>O</span><span>O</span><span>N</span>
        </span>
      </h1>

      <div class="progress reveal" style="--d:1.5s" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68" aria-label="Build progress">
        <div class="bar"><span class="fill"></span></div>
        <div class="progress-meta"><span>Building</span><span class="pct" id="pct">0%</span></div>
      </div>

      <p class="lede reveal" style="--d:1.65s">
        <span class="lede-long">We're putting the final polish on something we think you'll like.
        Drop your email and you'll be the first one through the door.</span>
        <span class="lede-short">Drop your email — be first through the door.</span>
      </p>

      <form class="signup reveal" id="signup" style="--d:1.78s" novalidate>
        <div class="field">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5v-9Z"/><path d="m4 8 8 5 8-5"/></svg>
          <input id="email" type="email" name="email" placeholder="you@example.com" autocomplete="email" spellcheck="false" required />
        </div>
        <button type="submit" class="btn">
          <span class="btn-label">Notify me</span>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
        <p class="note" id="note" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <!-- ── Footer ─────────────────────────────────────── -->
  <footer class="bottombar reveal" style="--d:1.9s">
    <p class="copy">© <span id="year">2026</span> Amanets<span class="copy-long">. All rights reserved.</span></p>

    <nav class="socials" aria-label="Social links">
      <a href="#" aria-label="X (Twitter)" title="X">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h3.6l4.3 6 5-6H19l-6.4 7.6L20 20h-3.6l-4.6-6.4L6.4 20H5l6.8-8.1L4 4Z" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="#" aria-label="Instagram" title="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="3.8"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="#" aria-label="LinkedIn" title="LinkedIn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 10.5V17M8 7.6v.1M12 17v-3.6a2.2 2.2 0 0 1 4.4 0V17"/></svg>
      </a>
      <a href="mailto:contact@accidentpayments.com" aria-label="Email us" title="Email">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 8 8 5 8-5"/></svg>
      </a>
    </nav>
  </footer>
</div>

<script src="assets/starfield.js" defer></script>
<script src="script.js" defer></script>
</body>
</html>
